<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Product Review Form for submitting a product review.">
    <meta name="author" content="Mfonobong">

    <title>Product Review</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/form.css">

    <!-- JavaScript -->
    <script src="scripts/form.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main>
    <form method="get" action="review.html">

        <!-- Product Name -->
        <label for="product-name">Product Name</label>

        <select id="product-name" name="product-name" required>
            <option value="" disabled selected>
                Select a Product ...
            </option>
        </select>


        <!-- Overall Rating -->
        <fieldset>
            <legend>Overall Rating</legend>

            <div class="rating">

                <label for="rating-1">
                    <input
                        type="radio"
                        id="rating-1"
                        name="rating"
                        value="1"
                        required>
                    <span>☆</span>
                    <span class="rating-number">1</span>
                </label>

                <label for="rating-2">
                    <input
                        type="radio"
                        id="rating-2"
                        name="rating"
                        value="2"
                        required>
                    <span>☆☆</span>
                    <span class="rating-number">2</span>
                </label>

                <label for="rating-3">
                    <input
                        type="radio"
                        id="rating-3"
                        name="rating"
                        value="3"
                        required>
                    <span>☆☆☆</span>
                    <span class="rating-number">3</span>
                </label>

                <label for="rating-4">
                    <input
                        type="radio"
                        id="rating-4"
                        name="rating"
                        value="4"
                        required>
                    <span>☆☆☆☆</span>
                    <span class="rating-number">4</span>
                </label>

                <label for="rating-5">
                    <input
                        type="radio"
                        id="rating-5"
                        name="rating"
                        value="5"
                        required>
                    <span>☆☆☆☆☆</span>
                    <span class="rating-number">5</span>
                </label>

            </div>
        </fieldset>


        <!-- Date of Installation -->
        <label for="installation-date">
            Date of Installation
        </label>

        <input
            type="date"
            id="installation-date"
            name="installation-date"
            required>


        <!-- Useful Features -->
        <fieldset>
            <legend>Useful Features</legend>

            <label for="feature-durability">
                <input
                    type="checkbox"
                    id="feature-durability"
                    name="features"
                    value="Durability">
                Durability
            </label>

            <label for="feature-design">
                <input
                    type="checkbox"
                    id="feature-design"
                    name="features"
                    value="Design">
                Design
            </label>

            <label for="feature-performance">
                <input
                    type="checkbox"
                    id="feature-performance"
                    name="features"
                    value="Performance">
                Performance
            </label>

            <label for="feature-ease">
                <input
                    type="checkbox"
                    id="feature-ease"
                    name="features"
                    value="Ease of Use">
                Ease of Use
            </label>

        </fieldset>


        <!-- Written Review -->
        <label for="written-review">
            Written Review
        </label>

        <textarea
            id="written-review"
            name="written-review"
            rows="6"
            placeholder="Write your review here..."></textarea>


        <!-- User Name -->
        <label for="user-name">
            Your Name <span>(Optional)</span>
        </label>

        <input
            type="text"
            id="user-name"
            name="user-name"
            autocomplete="name">


        <!-- Submit -->
        <input
            type="submit"
            value="Submit Review">

    </form>
</main>

<footer>
    <p>
        &copy; <span id="currentyear"></span> Mfonobong
    </p>

    <p id="lastModified"></p>
</footer>

</body>
</html>
