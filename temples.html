<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A responsive Temple Album featuring temples from around the world.">
    <meta name="author" content="Mfonobong">

    <title>Temple Album</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <!-- JavaScript -->
    <script src="scripts/temples.js" defer></script>
</head>

<body>

    <header>
        <div class="header-content">
            <span class="site-title">Temple Album</span>

            <!-- Hamburger Button -->
            <button id="menu-button" aria-label="Open navigation menu">
                ☰
            </button>

            <!-- Navigation -->
            <nav id="navigation">
                <a href="#">Home</a>
                <a href="#">Old</a>
                <a href="#">New</a>
                <a href="#">Large</a>
                <a href="#">Small</a>
            </nav>
        </div>
    </header>

    <main>
        <h1>Temple Album</h1>

        <div class="temple-grid">

            <figure>
                <img src="images/temple.jpg" alt="Accra Ghana Temple">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple.jpg" alt="Abidjan Ivory Coast Temple">
                <figcaption>Abidjan Ivory Coast Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple.jpg" alt="Johannesburg South Africa Temple">
                <figcaption>Johannesburg South Africa Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple.jpg" alt="Lagos Nigeria Temple">
                <figcaption>Lagos Nigeria Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple.jpg" alt="Durban South Africa Temple">
                <figcaption>Durban South Africa Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple.jpg" alt="Nairobi Kenya Temple">
                <figcaption>Nairobi Kenya Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple.jpg" alt="Harare Zimbabwe Temple">
                <figcaption>Harare Zimbabwe Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple.jpg" alt="Cape Town South Africa Temple">
                <figcaption>Cape Town South Africa Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple.jpg" alt="Kinshasa Democratic Republic of Congo Temple">
                <figcaption>Kinshasa Democratic Republic of Congo Temple</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Mfonobong
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
