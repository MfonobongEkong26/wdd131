<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Confirmation page for your product review submission.">
    <meta name="author" content="Mfonobong">

    <title>Review Submitted</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto&family=Roboto+Slab:wght@700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="styles/form.css">

    <!-- JavaScript -->
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Review Submitted</h1>
    </header>

    <main class="confirmation">

        <section class="confirmation-card">

            <h2>Thank You!</h2>

            <p>
                Your product review has been successfully submitted.
            </p>

            <p>
                We appreciate you taking the time to share your experience.
            </p>

            <div class="review-count">
                <p>
                    Reviews completed:
                    <strong id="review-count">0</strong>
                </p>
            </div>

            <a class="back-link" href="form.html">
                Submit Another Review
            </a>

        </section>

    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Mfonobong
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
